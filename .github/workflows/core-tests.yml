name: Core tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/eztiger_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  # Pro's Vocal cut, run through real ffmpeg with test tones and measured.
  vocal-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -hide_banner -filters | grep -E ' (surround|pan|aformat) '
      - run: dart tool/check_vocal_cut.dart
