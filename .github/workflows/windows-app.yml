name: Windows app

on:
  push:
    branches: [main, windows-app, claude/easy-tiger-android-download-yuyply]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pro's "Remove vocals (AI)": demucs (the Demucs stem-separation model, from
  # demucs-rs, Apache-2.0, pinned to one commit) and ffmpeg (to mix the
  # instrumental and write the MP3 with its tags). demucs.exe uses the
  # graphics card (Vulkan); demucs-cpu.exe is the fallback for PCs without
  # one. The model itself (84 MB) downloads from Hugging Face on first use.
  # Dean OK'd bundling demucs and ffmpeg in the Pro installer on 2026-11-11.
  vocal-tools:
    runs-on: windows-latest
    env:
      DEMUCS_RS_COMMIT: 805d6f72ede20282832ac78c634e8767716c0b21
    steps:
      # The finished tools, kept between builds: compiling demucs takes
      # ~25 minutes, so it only happens when the pinned commit changes.
      - name: Reuse the tools built before
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: vocal-tools-${{ env.DEMUCS_RS_COMMIT }}-v1

      - uses: actions/checkout@v4
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          repository: nikhilunni/demucs-rs
          ref: ${{ env.DEMUCS_RS_COMMIT }}
          path: demucs-rs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tools.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          workspaces: demucs-rs -> target
          key: ${{ env.DEMUCS_RS_COMMIT }}

      - name: Build demucs (graphics card) and demucs-cpu
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: demucs-rs
        run: |
          cargo build -p demucs-cli --release
          if ($LASTEXITCODE -ne 0) { throw "demucs build failed" }
          cargo build -p demucs-cli --release --features cpu --target-dir target-cpu
          if ($LASTEXITCODE -ne 0) { throw "demucs-cpu build failed" }
          $tools = Join-Path $env:RUNNER_TEMP tools
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item target\release\demucs.exe "$tools\demucs.exe"
          Copy-Item target-cpu\release\demucs.exe "$tools\demucs-cpu.exe"
          Copy-Item LICENSE* "$tools\" -ErrorAction SilentlyContinue

      - name: ffmpeg (LGPL build, with the MP3 encoder)
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP tools
          $zip = Join-Path $env:RUNNER_TEMP ffmpeg.zip
          curl.exe -fsSL --retry 3 -o $zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$tools\ffmpeg.exe"
          $enc = & "$tools\ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          if ($enc -notmatch 'libmp3lame') { throw "this ffmpeg has no MP3 encoder (libmp3lame)" }

      # The graphics-card version can't run here (no GPU), so try the CPU one
      # end to end on a short clip: separate, then mix the instrumental the
      # way EZTiger does.
      - name: Try a separation
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP tools
          $t = Join-Path $env:RUNNER_TEMP try
          New-Item -ItemType Directory -Force $t | Out-Null
          & "$tools\ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i "sine=f=220:d=8" -f lavfi -i "sine=f=880:d=8" -filter_complex "[0][1]amerge=inputs=2[a]" -map "[a]" -ar 44100 -metadata title="Test Song" -metadata artist="Test Band" "$t\song.mp3"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & "$tools\demucs-cpu.exe" -m htdemucs -s drums,bass,other -o "$t\stems" "$t\song.mp3"
          if ($LASTEXITCODE -ne 0) { throw "demucs-cpu failed" }
          $secs = [int]$sw.Elapsed.TotalSeconds
          foreach ($s in 'drums','bass','other') { if (-not (Test-Path "$t\stems\$s.wav")) { throw "no $s.wav" } }
          if (Test-Path "$t\stems\vocals.wav") { throw "vocals.wav should not be written" }
          & "$tools\ffmpeg.exe" -hide_banner -loglevel error -y -i "$t\stems\drums.wav" -i "$t\stems\bass.wav" -i "$t\stems\other.wav" -i "$t\song.mp3" -filter_complex "[0][1][2]amix=inputs=3:normalize=0[a]" -map "[a]" -map_metadata 3 -metadata title="Test Song EZVocrem" -id3v2_version 3 -c:a libmp3lame -q:a 2 "$t\song EZVocrem.mp3"
          if ($LASTEXITCODE -ne 0) { throw "mixing the instrumental failed" }
          $tags = & "$tools\ffmpeg.exe" -hide_banner -i "$t\song EZVocrem.mp3" 2>&1 | Out-String
          if ($tags -notmatch 'title\s*:\s*Test Song EZVocrem' -or $tags -notmatch 'artist\s*:\s*Test Band') { throw "tags not written: $tags" }
          "::notice title=Remove vocals::demucs-cpu separated an 8 s clip in $secs s (includes the one-time model download); the instrumental MP3 has its tags"
          # (ffmpeg -i with no output file "fails" by design; the checks above passed.)
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: vocal-tools
          path: ${{ runner.temp }}/tools

  build:
    needs: vocal-tools
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      # Each issue also goes on the run's summary page (readable without
      # signing in to the log).
      - name: Analyze
        shell: pwsh
        run: |
          $out = dart analyze --fatal-infos --format=machine 2>&1
          $code = $LASTEXITCODE
          foreach ($l in $out) {
            $p = "$l".Split('|')
            if ($p.Count -ge 8) { "::error title=$($p[2])::$(Split-Path $p[3] -Leaf):$($p[4]) $($p[7])" }
            elseif ($code -ne 0 -and "$l".Trim()) { "::notice title=analyze::$l" }
            else { "$l" }
          }
          exit $code

      - name: Test
        shell: pwsh
        run: |
          flutter test --file-reporter "json:$env:RUNNER_TEMP\test-results.json"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Each failed test on the run's summary, with what went wrong.
            $names = @{}; $errors = @{}
            foreach ($line in Get-Content "$env:RUNNER_TEMP\test-results.json") {
              try { $e = $line | ConvertFrom-Json } catch { continue }
              if ($e.type -eq 'testStart') { $names[[string]$e.test.id] = $e.test.name }
              if ($e.type -eq 'error') { $errors[[string]$e.testID] += "$($e.error) " }
            }
            foreach ($id in $errors.Keys) {
              $msg = ($errors[$id] -replace '\s+', ' ').Trim()
              if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
              "::error title=Failed: $($names[$id])::$msg"
            }
          }
          exit $code

      - name: Build
        run: flutter build windows --release

      - name: Check the build has everything it needs
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          Get-ChildItem $dir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          foreach ($f in @("eztiger.exe", "flutter_windows.dll")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Get-ChildItem $dir -Recurse -Filter "*mpv*.dll")) { throw "missing libmpv" }
          if (-not (Get-ChildItem $dir -Recurse -Filter "*sqlite3*.dll")) { throw "missing sqlite3.dll" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Make the installer
        shell: pwsh
        working-directory: installer
        run: |
          $version = (Select-String -Path ..\app\pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=..\app\build\windows\x64\runner\Release" eztiger.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # EZTiger Pro: the same code, built with the Pro features on and the
      # gold Pro icon, then its own installer (which upgrades Basic in place).
      - name: Build Pro
        shell: pwsh
        run: |
          Copy-Item windows\runner\resources\app_icon_pro.ico windows\runner\resources\app_icon.ico -Force
          flutter build windows --release --dart-define=EZ_EDITION=pro
          if ($LASTEXITCODE -ne 0) { throw "Pro build failed" }

      # Pro's Level and Vocal cut need ffmpeg filters (loudnorm, lowpass,
      # highpass, amix, asplit) that media_kit's bundled libmpv leaves out.
      # Swap in a full libmpv build, pinned by name and SHA-256 (Dean OK'd
      # this on 2026-11-06). Basic keeps the bundled one.
      - name: Full libmpv for Pro
        shell: pwsh
        env:
          LIBMPV_NAME: mpv-dev-x86_64-20261018-git-01e2533f31.7z
          LIBMPV_SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e
        run: |
          $dir = Join-Path $env:RUNNER_TEMP libmpv
          New-Item -ItemType Directory -Force $dir | Out-Null
          $archive = Join-Path $dir $env:LIBMPV_NAME
          $url = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/$($env:LIBMPV_NAME)/download"
          for ($i = 1; $i -le 4; $i++) {
            curl.exe -fsSL --retry 3 -A "Wget/1.21" -o $archive $url
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $archive -Algorithm SHA256).Hash -eq $env:LIBMPV_SHA256) { break }
            if ($i -eq 4) { throw "Could not download $($env:LIBMPV_NAME) with the expected SHA-256" }
            Start-Sleep -Seconds (2 * $i)
          }
          7z e $archive -o"$dir\out" libmpv-2.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\libmpv-2.dll")) { throw "No bundled libmpv-2.dll to replace in $release" }
          Copy-Item "$dir\out\libmpv-2.dll" "$release\libmpv-2.dll" -Force
          Get-Item "$release\libmpv-2.dll" | Format-Table Name, Length

      # Pro's "Remove vocals (AI)" tools, into tools\ beside eztiger.exe.
      - uses: actions/download-artifact@v4
        with:
          name: vocal-tools
          path: app/build/windows/x64/runner/Release/tools

      - name: Make the Pro installer
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${env:APP_VERSION}" "/DEdition=Pro" "/DSourceDir=..\app\build\windows\x64\runner\Release" eztiger.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem Output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EZtiger-Setup
          path: |
            installer/Output/EZtiger-Setup.exe
            installer/Output/EZTiger-Pro-Setup.exe

      - name: Publish a test download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: EZtiger ${{ env.APP_VERSION }} (test build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            installer/Output/EZtiger-Setup.exe
            installer/Output/EZTiger-Pro-Setup.exe
          body: |
            Test build from `${{ github.ref_name }}`.
            **EZTiger-Pro-Setup.exe** is EZTiger Pro, and installs over Basic as an upgrade. **EZtiger-Setup.exe** is EZTiger Basic. Windows may say "Windows protected your PC" because the installer isn't signed yet: click **More info**, then **Run anyway**.
