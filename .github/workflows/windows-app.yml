name: Windows app

on:
  push:
    branches: [main, windows-app, claude/easy-tiger-android-download-yuyply]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Check the build has everything it needs
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          Get-ChildItem $dir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          foreach ($f in @("eztiger.exe", "flutter_windows.dll")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Get-ChildItem $dir -Recurse -Filter "*mpv*.dll")) { throw "missing libmpv" }
          if (-not (Get-ChildItem $dir -Recurse -Filter "*sqlite3*.dll")) { throw "missing sqlite3.dll" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Make the installer
        shell: pwsh
        working-directory: installer
        run: |
          $version = (Select-String -Path ..\app\pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=..\app\build\windows\x64\runner\Release" eztiger.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # EZTiger Pro: the same code, built with the Pro features on and the
      # gold Pro icon, then its own installer (which upgrades Basic in place).
      - name: Build Pro
        shell: pwsh
        run: |
          Copy-Item windows\runner\resources\app_icon_pro.ico windows\runner\resources\app_icon.ico -Force
          flutter build windows --release --dart-define=EZ_EDITION=pro
          if ($LASTEXITCODE -ne 0) { throw "Pro build failed" }

      # Pro's Level and Vocal cut need ffmpeg filters (loudnorm, lowpass,
      # highpass, amix, asplit) that media_kit's bundled libmpv leaves out.
      # Swap in a full libmpv build, pinned by name and SHA-256 (Dean OK'd
      # this on 2026-11-06). Basic keeps the bundled one.
      - name: Full libmpv for Pro
        shell: pwsh
        env:
          LIBMPV_NAME: mpv-dev-x86_64-20261018-git-01e2533f31.7z
          LIBMPV_SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e
        run: |
          $dir = Join-Path $env:RUNNER_TEMP libmpv
          New-Item -ItemType Directory -Force $dir | Out-Null
          $archive = Join-Path $dir $env:LIBMPV_NAME
          $url = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/$($env:LIBMPV_NAME)/download"
          for ($i = 1; $i -le 4; $i++) {
            curl.exe -fsSL --retry 3 -A "Wget/1.21" -o $archive $url
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $archive -Algorithm SHA256).Hash -eq $env:LIBMPV_SHA256) { break }
            if ($i -eq 4) { throw "Could not download $($env:LIBMPV_NAME) with the expected SHA-256" }
            Start-Sleep -Seconds (2 * $i)
          }
          7z e $archive -o"$dir\out" libmpv-2.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\libmpv-2.dll")) { throw "No bundled libmpv-2.dll to replace in $release" }
          Copy-Item "$dir\out\libmpv-2.dll" "$release\libmpv-2.dll" -Force
          Get-Item "$release\libmpv-2.dll" | Format-Table Name, Length

      - name: Make the Pro installer
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${env:APP_VERSION}" "/DEdition=Pro" "/DSourceDir=..\app\build\windows\x64\runner\Release" eztiger.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem Output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EZtiger-Setup
          path: |
            installer/Output/EZtiger-Setup.exe
            installer/Output/EZTiger-Pro-Setup.exe

      - name: Publish a test download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: EZtiger ${{ env.APP_VERSION }} (test build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            installer/Output/EZtiger-Setup.exe
            installer/Output/EZTiger-Pro-Setup.exe
          body: |
            Test build from `${{ github.ref_name }}`.
            **EZTiger-Pro-Setup.exe** is EZTiger Pro, and installs over Basic as an upgrade. **EZtiger-Setup.exe** is EZTiger Basic. Windows may say "Windows protected your PC" because the installer isn't signed yet: click **More info**, then **Run anyway**.
