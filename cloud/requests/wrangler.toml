# The online request list on Cloudflare (free plan). Deploy: see README.md.
name = "eztiger-requests"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep ALLOW_SIGNUPS (set in the dashboard or with --var) when deploying again.
keep_vars = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# The singers' page (with the song list), as EZTiger last sent it.
[[kv_namespaces]]
binding = "PAGES"
id = "49670f0adffd47b189eafbd5a18dc868"

# The request list.
[[d1_databases]]
binding = "DB"
database_name = "eztiger-requests"
database_id = "1926410e-4f14-4747-8221-570a3271c438"

# DJ_KEY (the code in the owner's DJ link) is a secret: wrangler secret put DJ_KEY
# ALLOW_SIGNUPS = "yes" lets other DJs get their own list from EZTiger
# (☰ Menu → Song requests → Get my online request page). Only the EZTiger
# owner's service turns it on (in the dashboard, or with --var); a DJ hosting
# their own copy leaves it off.
